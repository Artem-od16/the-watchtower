name: Final Watchtower

on:
  push:
    branches: [main]

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Force Sync and Restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          # Changed to match your exact secret name: SSH_PRIVATE_KEY
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Check if directory exists, clone if missing
            if [ ! -d "~/the-watchtower" ]; then
              git clone https://github.com/Artem-od16/the-watchtower.git ~/the-watchtower
            fi
            
            cd ~/the-watchtower || exit
            
            # Sync local repository with remote main branch
            git fetch origin main
            git reset --hard origin/main
            
            # Stop existing containers and cleanup orphans
            docker compose down --remove-orphans || true
            docker rm -f node-exporter grafana prometheus python-monitor || true
            
            # Inject environment variables for notifications
            export TELEGRAM_TOKEN="${{ secrets.TELEGRAM_TOKEN }}"
            export TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
            
            # Deploy updated stack
            docker compose up -d --build
