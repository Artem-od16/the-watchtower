global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'watchtower-server'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'deployer-server'
    static_configs:
      - targets: ['13.62.18.22:9100']

  - job_name: 'python-monitor'
    static_configs:
      - targets: ['python-monitor:8000']